<!DOCTYPE html>
<html>
    <head>
        <title>Electric Boogaloo</title>
    </head>
    <body>
        <h1>My Terms of Service</h1>
        <h2><a href="index.html">Go Back To Page 1</a></h2>
        <h2><a href="second.html">Go Back To Page 2</a></h2>
        <h2>Please enter your full name and email address and agree to my terms of service.</h2>
        <form action="fourth.html" onsubmit="return checkAnswer()">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email Address:</label>
            <input type="text" id="email" name="email" required><br><br>
        <h2>Terms of Service</h2>
        <p>By clicking yes, you agree to let me sell all your personal information. By clicking no, you decline to me selling your information.</p>
        <input type="radio" id="yes" name="terms" value="no" required>
        <label for="yes">Yeah okay</label>
        <input type="radio" id="no" name="terms" value="yes" required>
        <label for="no">No thanks</label>
        <input type="submit" value="Submit">
        </form>
    </body>
    <script>
function checkAnswer() {
    const selected = document.querySelector('input[name="terms"]:checked');

    if (selected && selected.value === "yes") {
        return true;
    }

    return false;
}
</script>
</html>
